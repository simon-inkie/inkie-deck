name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both current LTS lines, which is exactly what the engines range
        # `^22.13.0 || >=24.0.0` permits. The 22 floor is jsdom's, the
        # strictest constraint in the tree. The range form rather than a `>=`
        # is what keeps the odd-numbered lines out: 23 is above the floor by
        # any arithmetic and has never had a supported day.
        #
        # This matrix runs the LATEST of each line, so nothing here or in
        # rig/ exercises 22.13.0 itself. It was measured by hand when the
        # floor was set, and it is green; it is not measured continuously.
        node-version: ["22.x", "24.x"]
    steps:
      - uses: actions/checkout@v4

      # Reads the pinned version from the "packageManager" field in
      # package.json, so CI and local installs use the same pnpm.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      # This job runs exactly the command list in the root README's
      # Development section, in the same order, so CI can never report
      # greener than a developer's local run.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Dependency boundary check
        run: pnpm check:boundaries

  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans commit history, not just the tree.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      # The self-test proves every denylist rule still fires (against
      # runtime-assembled samples in a temp file, never committed fixtures)
      # before the real scan certifies the tree clean.
      - name: Leak gate self-test
        run: node scripts/leak-gate.mjs --self-test

      - name: Leak gate
        run: node scripts/leak-gate.mjs

      - name: gitleaks (credential scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Kept as its own job so the red is unmistakably this gate. It FAILS on
  # purpose until the LICENSE placeholder is replaced with the company's
  # exact registered name; see scripts/licence-gate.mjs for the reasoning.
  licence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Licence gate
        run: node scripts/licence-gate.mjs
