name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both current LTS lines. The floor is Node 22.18, the first release
        # where native TypeScript type stripping is on by default, which is
        # what lets packages/base run with no build step.
        node-version: ["22.x", "24.x"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # Deliberately BEFORE `npm ci`: the protocol CLI advertises that it
      # runs from a fresh clone with nothing installed, so prove that on
      # every push rather than trusting it.
      - name: Run the protocol CLI with no dependencies installed
        run: AGENT_NAME=ci node packages/base/bin/inbox.mts unread

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Includes the capability-absence suite in packages/deck: with no
      # hosted service configured the client must degrade, never break.
      - name: Unit tests
        run: npm test

      - name: Dependency boundary check
        run: npm run check:boundaries

  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans commit history, not just the tree.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      # The self-test proves every denylist rule still fires (against
      # runtime-assembled samples in a temp file, never committed fixtures)
      # before the real scan certifies the tree clean.
      - name: Leak gate self-test
        run: node scripts/leak-gate.mjs --self-test

      - name: Leak gate
        run: node scripts/leak-gate.mjs

      - name: gitleaks (credential scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Kept as its own job so the red is unmistakably this gate. It FAILS on
  # purpose until the LICENSE placeholder is replaced with the company's
  # exact registered name; see scripts/licence-gate.mjs for the reasoning.
  licence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Licence gate
        run: npm run check:licence
