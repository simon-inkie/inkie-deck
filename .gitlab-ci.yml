stages:
  - test
  - guards

.rules_template:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Both current LTS lines, which is exactly what the engines range
# `^22.13.0 || >=24.0.0` permits. The 22 floor is jsdom's, the strictest
# constraint in the tree. The range form rather than a `>=` is what keeps the
# odd-numbered lines out: 23 is above the floor by any arithmetic and has
# never had a supported day. Both jobs run the LATEST of their line, so
# neither exercises 22.13.0 itself.
#
# corepack activates the exact pnpm pinned in package.json's "packageManager"
# field, so CI and local installs use the same package manager version. The
# script then runs exactly the command list in the root README's Development
# section, in the same order, so CI can never report greener than a
# developer's local run.
.test_template:
  extends: .rules_template
  stage: test
  before_script:
    - corepack enable
    - corepack prepare --activate
  script:
    - pnpm install --frozen-lockfile
    - pnpm typecheck
    - pnpm test
    - pnpm check:boundaries

test:node-22:
  extends: .test_template
  image: node:22

test:node-24:
  extends: .test_template
  image: node:24

# The self-test proves every denylist rule still fires (against
# runtime-assembled samples in a temp file, never committed fixtures) before
# the real scan certifies the tree clean.
leak-gate:
  extends: .rules_template
  stage: guards
  image: node:22
  script:
    - node scripts/leak-gate.mjs --self-test
    - node scripts/leak-gate.mjs

gitleaks:
  extends: .rules_template
  stage: guards
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source . --redact --verbose

# Kept as its own job so the red is unmistakably this gate. It FAILS on
# purpose until the LICENSE placeholder is replaced with the company's exact
# registered name; see scripts/licence-gate.mjs for the reasoning.
licence-gate:
  extends: .rules_template
  stage: guards
  image: node:22
  script:
    - node scripts/licence-gate.mjs
