stages:
  - test
  - guards

.rules_template:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Both current LTS lines, which is exactly what the engines range
# `^22.13.0 || >=24.0.0` permits. The 22 floor is jsdom's, the strictest
# constraint in the tree. The range form rather than a `>=` is what keeps the
# odd-numbered lines out: 23 is above the floor by any arithmetic and has
# never had a supported day. Both jobs run the LATEST of their line, so
# neither exercises 22.13.0 itself.
#
# corepack activates the exact pnpm pinned in package.json's "packageManager"
# field, so CI and local installs use the same package manager version. The
# script then runs exactly the command list in the root README's Development
# section, in the same order, so CI can never report greener than a
# developer's local run.
#
# The apt line and the locale are the same two prerequisites, for the same
# reasons, that rig/lib/images.mjs puts into its toolchain image. Without them
# these jobs could not go green whatever the tree looked like, which is what
# they were until this commit: node:22 and node:24 are Debian bookworm with
# git, curl and python3 in them already, but with no ripgrep (four suites name
# it and go red), no xxd (the base package's inbox suite stops dead with `xxd:
# command not found`) and no locale at all (ten of the seventy
# delivery-classification cases fail in C, and the same break at runtime is a
# message never typed into a pane that was ready for it). Verified by running
# this exact sequence by hand in both images, there being no pipeline to push
# to.
.test_template:
  extends: .rules_template
  stage: test
  variables:
    # An environment variable for the whole job, matching the rig's `ENV
    # LANG=C.UTF-8` rather than a shell export, so it holds for anything the job
    # runs and not only for whatever follows it in one script.
    LANG: C.UTF-8
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends ripgrep xxd
    - corepack enable
    - corepack prepare --activate
  script:
    - pnpm install --frozen-lockfile
    - pnpm typecheck
    - pnpm test
    - pnpm check:boundaries

test:node-22:
  extends: .test_template
  image: node:22

test:node-24:
  extends: .test_template
  image: node:24

# The self-test proves every denylist rule still fires (against
# runtime-assembled samples in a temp file, never committed fixtures) before
# the real scan certifies the tree clean.
leak-gate:
  extends: .rules_template
  stage: guards
  image: node:22
  script:
    - node scripts/leak-gate.mjs --self-test
    - node scripts/leak-gate.mjs

gitleaks:
  extends: .rules_template
  stage: guards
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source . --redact --verbose

# Kept as its own job so the red is unmistakably this gate. It FAILS on
# purpose until the LICENSE placeholder is replaced with the company's exact
# registered name; see scripts/licence-gate.mjs for the reasoning.
licence-gate:
  extends: .rules_template
  stage: guards
  image: node:22
  script:
    - node scripts/licence-gate.mjs
