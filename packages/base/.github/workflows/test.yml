name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both current LTS lines. The floor is Node 22.18, the first release
        # where native TypeScript type stripping is on by default, which is
        # what lets bin/inbox.mts run with no build step.
        node-version: ["22.x", "24.x"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # Deliberately BEFORE `npm ci`: the tool advertises that it runs from a
      # fresh clone with nothing installed, so prove that on every push rather
      # than trusting it.
      - name: Run the CLI with no dependencies installed
        run: AGENT_NAME=ci node bin/inbox.mts unread

      - name: Install dev dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test
